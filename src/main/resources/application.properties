quarkus.application.name=fulfillment-adapter
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=fulfillment-adapter REST API
quarkus.smallrye-openapi.info-version=1.0.0
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://fulfillment-adapter-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call this service directly.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,PATCH,DELETE
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Correlation-ID,traceparent
quarkus.http.cors.access-control-allow-credentials=false

# A valid request body is far smaller.
quarkus.http.limits.max-body-size=16K
quarkus.jackson.fail-on-unknown-properties=true

# PostgreSQL. The JDBC URL, username and password come from the environment at runtime.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.datasource.jdbc.max-size=10
# Keeps row values out of driver messages.
quarkus.datasource.jdbc.additional-jdbc-properties.logServerErrorDetail=false
# Fail fast when the database is gone, so acceptance answers 503 instead of hanging.
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.datasource.health.enabled=false
fulfillment.readiness.database=true

# Kafka. fulfillment.requested.v1 arrives on the order topic; other types there are acknowledged with no effect.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=box1.order.events.v1
mp.messaging.incoming.order-events.group.id=fulfillment
# Earliest plus request-ID dedupe: a skipped request would leave its order waiting forever (D-010).
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.order-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events.dead-letter-queue.topic=${fulfillment.dlq.topic}
mp.messaging.incoming.order-events.throttled.unprocessed-record-max-age.ms=-1
mp.messaging.incoming.order-events.health-readiness-enabled=false
mp.messaging.incoming.order-events.tracing-enabled=false
mp.messaging.incoming.order-events.enabled=${FULFILLMENT_KAFKA_INPUT_ENABLED:true}
fulfillment.dlq.topic=box1.fulfillment.dlq.v1
fulfillment.consumer.max-attempts=${FULFILLMENT_CONSUMER_MAX_ATTEMPTS:20}
fulfillment.consumer.initial-backoff-millis=${FULFILLMENT_CONSUMER_INITIAL_BACKOFF_MILLIS:500}
fulfillment.consumer.max-backoff-millis=${FULFILLMENT_CONSUMER_MAX_BACKOFF_MILLIS:30000}

# Outcome events (shipment.confirmed.v1, shipment.failed.v1) through the outbox.
fulfillment.outbox.topic=box1.fulfillment.events.v1
fulfillment.outbox.poll-interval=${FULFILLMENT_OUTBOX_POLL_INTERVAL:1s}
fulfillment.outbox.batch-size=100
fulfillment.outbox.lease-seconds=60
fulfillment.outbox.backoff-base-seconds=1
fulfillment.outbox.backoff-max-seconds=300

# Backend strategy: only the legacy ERP1 file backend exists.
fulfillment.backend=legacy-erp1

# Dispatch and reconciliation schedule (D-004). All deadlines use database time.
fulfillment.dispatch.poll-interval-ms=${FULFILLMENT_DISPATCH_POLL_MS:1000}
# Lease outlasts a batch even at the worst-case transfer time (10 x 40 s).
fulfillment.dispatch.batch-size=10
fulfillment.dispatch.lease-seconds=600
fulfillment.upload.backoff-base-seconds=${FULFILLMENT_UPLOAD_BACKOFF_BASE_SECONDS:10}
fulfillment.upload.backoff-max-seconds=${FULFILLMENT_UPLOAD_BACKOFF_MAX_SECONDS:300}
fulfillment.upload.max-attempts=${FULFILLMENT_UPLOAD_MAX_ATTEMPTS:40}
fulfillment.ack.timeout-base-seconds=${FULFILLMENT_ACK_TIMEOUT_BASE_SECONDS:120}
fulfillment.ack.timeout-max-seconds=${FULFILLMENT_ACK_TIMEOUT_MAX_SECONDS:3600}
fulfillment.ack.max-unacknowledged-uploads=${FULFILLMENT_ACK_MAX_UPLOADS:8}
# Transport-damage ERR files (TRUNCATED, COUNT_MISMATCH, ENCODING, UNREADABLE) resent with backoff, then needs-attention.
fulfillment.err.max-resends=${FULFILLMENT_ERR_MAX_RESENDS:5}
fulfillment.ack.probe-interval-seconds=${FULFILLMENT_PROBE_INTERVAL_SECONDS:21600}
fulfillment.reconcile.poll-interval-ms=${FULFILLMENT_RECONCILE_POLL_MS:5000}
fulfillment.results.poll-interval-ms=${FULFILLMENT_RESULTS_POLL_MS:2000}
fulfillment.results.hidden-sweep-interval-ms=${FULFILLMENT_HIDDEN_SWEEP_MS:60000}
fulfillment.consumed.retention=${FULFILLMENT_CONSUMED_RETENTION:P7D}
fulfillment.consumed.sweep-interval-ms=3600000
fulfillment.metrics.refresh-interval=${FULFILLMENT_METRICS_REFRESH_INTERVAL:15s}

# SFTP to the ERP exchange. Key-based, strict host-key checking always on; no accept-new mode exists.
# Disabled until the credential is provisioned (D-007); accepted work stays queued meanwhile.
fulfillment.sftp.enabled=${FULFILLMENT_SFTP_ENABLED:false}
fulfillment.sftp.host=${FULFILLMENT_SFTP_HOST:localhost}
fulfillment.sftp.port=${FULFILLMENT_SFTP_PORT:22}
fulfillment.sftp.username=${FULFILLMENT_SFTP_USERNAME:erpsftp}
fulfillment.sftp.private-key-file=${FULFILLMENT_SFTP_PRIVATE_KEY_FILE:/var/run/secrets/box1/sftp/id_ed25519}
fulfillment.sftp.known-hosts-file=${FULFILLMENT_SFTP_KNOWN_HOSTS_FILE:/var/run/secrets/box1/sftp/known_hosts}
fulfillment.sftp.connect-timeout-ms=10000
fulfillment.sftp.timeout-ms=30000

# Camel
camel.context.name=fulfillment-adapter
camel.main.shutdown-timeout=10
quarkus.shutdown.timeout=20s

# Access. POST and /internal need the fulfillment-writer client role from a box1 realm token (D-002).
# Reads follow FULFILLMENT_READ_POLICY: authenticated (default) or permit.
quarkus.http.auth.proactive=false
quarkus.smallrye-jwt.blocking-authentication=true
mp.jwt.verify.issuer=${FULFILLMENT_JWT_ISSUER:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
mp.jwt.verify.publickey.location=${FULFILLMENT_JWKS_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1/protocol/openid-connect/certs}
mp.jwt.verify.audiences=fulfillment-adapter
smallrye.jwt.path.groups=resource_access/fulfillment-adapter/roles
quarkus.http.auth.policy.writer.roles-allowed=fulfillment-writer
quarkus.http.auth.permission.write.paths=/api/fulfillments,/api/fulfillments/*,/internal/*
quarkus.http.auth.permission.write.methods=POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.write.policy=writer
quarkus.http.auth.permission.internal-read.paths=/internal/*
quarkus.http.auth.permission.internal-read.policy=writer
quarkus.http.auth.permission.read.paths=/api/fulfillments/*
quarkus.http.auth.permission.read.methods=GET,HEAD
quarkus.http.auth.permission.read.policy=${FULFILLMENT_READ_POLICY:authenticated}

# Traces propagate through W3C headers and ERP1 records. Export stays off until a collector exists (box1-docs#22).
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# Structured JSON logs in the deployed image; MDC carries fulfillmentRequestId, orderId, correlationId and trace IDs.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# The default test run has no database, broker or SFTP, because the CI task has no container runtime.
# Tests tagged "containers" supply them; run them with -Pcontainers.
quarkus.test.integration-test-profile=test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/service}
%test.quarkus.datasource.username=${TEST_DATABASE_USERNAME:postgres}
%test.quarkus.datasource.password=${TEST_DATABASE_PASSWORD:postgres}
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.scheduler.enabled=false
%test.fulfillment.readiness.database=false
%test.mp.messaging.incoming.order-events.enabled=false
%test.camel.main.auto-startup=false
