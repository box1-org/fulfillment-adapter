apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fulfillment-adapter
  description: "Protect the legacy ERP from unreliable upstream and unreliable transport."
  annotations:
    github.com/project-slug: box1-org/fulfillment-adapter
    backstage.io/kubernetes-id: fulfillment-adapter
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/fulfillment-adapter/
    janus-idp.io/tekton: fulfillment-adapter
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=fulfillment-adapter
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://github.com/box1-org/fulfillment-adapter
      title: Source Repository
      icon: github
    - url: https://fulfillment-adapter-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://fulfillment-adapter-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://fulfillment-adapter-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/fulfillment-adapter
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/fulfillment-adapter
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
  providesApis:
    - fulfillment-adapter-api
    - box1-fulfillment-events
  consumesApis:
    - box1-order-events
    - erp1-file-exchange
  dependsOn:
    - component:legacy-erp
    - resource:fulfillment-adapter-postgres
    - resource:box1-kafka
    - resource:keycloak-box1
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fulfillment-adapter-api
  description: OpenAPI contract for fulfillment-adapter
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
  definition:
    $text: https://fulfillment-adapter-dev.apps.ocp.box1.org/q/openapi
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: box1-fulfillment-events
  title: box1.fulfillment.events.v1
  description: Kafka topic box1.fulfillment.events.v1, produced by fulfillment-adapter through its transactional outbox. Contracts are owned by box1-ops-contracts.
  tags: [kafka, events, asyncapi]
  links:
    - url: https://github.com/box1-org/box1-ops-contracts/blob/main/TOPICS.md
      title: Topic ownership and consumer groups
      icon: docs
spec:
  type: asyncapi
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
  definition: |
    asyncapi: 2.6.0
    info:
      title: box1.fulfillment.events.v1
      version: v1
      description: >-
        Delivery is at least once; consumers record eventId transactionally.
        Partition key orderId. Retention 14d.
    servers:
      dev:
        url: box1-kafka-kafka-bootstrap.box1-kafka.svc:9092
        protocol: kafka
    channels:
      box1.fulfillment.events.v1:
        publish:
          summary: Events published by fulfillment-adapter
          message:
            oneOf:
            - name: shipment.confirmed.v1
              title: shipment.confirmed.v1
              summary: v1 envelope carrying shipment.confirmed (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/shipment.confirmed.schema.json)
              contentType: application/json
            - name: shipment.failed.v1
              title: shipment.failed.v1
              summary: v1 envelope carrying shipment.failed (see https://github.com/box1-org/box1-ops-contracts/blob/main/events/v1/shipment.failed.schema.json)
              contentType: application/json
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: fulfillment-adapter-postgres
  description: PostgreSQL database fulfillment_adapter owned by fulfillment-adapter (fulfillment-adapter-dev namespace)
  tags: [postgresql, database]
  links:
    - url: https://github.com/box1-org/box1-workloads-dev/blob/main/workloads/fulfillment-adapter/postgres.yaml
      title: Database manifest
spec:
  type: database
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
