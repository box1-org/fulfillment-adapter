---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  labels:
    backstage.io/kubernetes-id: fulfillment-adapter
  generateName: "fulfillment-adapter-release-"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: '10'
spec:
  taskRunTemplate:
    serviceAccountName: ci-build
  timeouts:
    pipeline: 45m
  params:
  - name: revision
    value: "{{revision}}"
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  - name: security-gates
    value: gate
  pipelineSpec:
    params:
    - name: revision
      type: string
    - name: git-auth-secret
      type: string
    - name: security-gates
      type: string
      default: disabled
    tasks:
    - name: build
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-quarkus-maven
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: push-image
        value: 'true'
      - name: source-repo
        value: box1-org/fulfillment-adapter
      - name: image-name
        value: "fulfillment-adapter"
    - name: security
      runAfter:
      - build
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-security-gates
        - name: namespace
          value: box1-ci
      params:
      - name: image-reference
        value: "image-registry.openshift-image-registry.svc:5000/box1-ci/fulfillment-adapter@$(tasks.build.results.image-digest)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: source-revision
        value: "$(params.revision)"
      - name: source-repository
        value: "box1-org/fulfillment-adapter"
      - name: application-name
        value: "fulfillment-adapter"
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: enforcement
        value: "$(params.security-gates)"
      - name: rhtpa-secret
        value: rhtpa-ci
      - name: rhacs-secret
        value: rhacs-ci
    - name: promote
      runAfter:
      - security
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-gitops-promote
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: environment
        value: development
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: application-name
        value: "fulfillment-adapter"
    - name: smoke
      runAfter:
      - promote
      when:
      - input: "$(tasks.promote.results.promoted)"
        operator: in
        values:
        - 'true'
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-quarkus-smoke
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: application-name
        value: "fulfillment-adapter"
      - name: application-namespace
        value: "fulfillment-adapter-dev"
    # The shared smoke task knows nothing about the adapter. These checks write nothing.
    - name: fulfillment-api-smoke
      runAfter:
      - smoke
      when:
      - input: "$(tasks.promote.results.promoted)"
        operator: in
        values:
        - 'true'
      taskSpec:
        steps:
        - name: fulfillment-api
          image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
          script: |
            #!/usr/bin/env python3
            import json, urllib.error, urllib.request
            base = 'https://fulfillment-adapter-dev.apps.ocp.box1.org'
            def call(path, method='GET', data=None, headers=None):
                request = urllib.request.Request(base + path, data=data, headers=headers or {}, method=method)
                try:
                    with urllib.request.urlopen(request, timeout=20) as response:
                        return response.status, response.read().decode()
                except urllib.error.HTTPError as error:
                    return error.code, error.read().decode()
            body = json.dumps({'fulfillmentRequestId': 'ful_smoke', 'orderId': 'ord_smoke', 'reservationId': 'res_smoke',
                               'siteId': 'site_smoke', 'sku': 'SMOKE', 'quantity': 1}).encode()
            # Anonymous callers can never create fulfillments through the Route.
            status, _ = call('/api/fulfillments', 'POST', body, {'Content-Type': 'application/json'})
            assert status == 401, status
            status, _ = call('/internal/fulfillments/ful_smoke/reconcile', 'POST', b'', {})
            assert status == 401, status
            status, _ = call('/api/fulfillments/ful_smoke_missing')
            assert status in (401, 404), status
            status, spec = call('/q/openapi')
            assert status == 200 and '/api/fulfillments' in spec, status
            print('fulfillment API smoke passed')
    results:
    - name: image-digest
      value: "$(tasks.build.results.image-digest)"
    - name: gitops-pr
      value: "$(tasks.promote.results.pr-url)"
    - name: gitops-revision
      value: "$(tasks.promote.results.gitops-revision)"
  taskRunSpecs:
  - pipelineTaskName: promote
    serviceAccountName: ci-gitops
  - pipelineTaskName: smoke
    serviceAccountName: ci-observe
